[project]
name = "risk-agent-deploy"
version = "0.1.0"
requires-python = ">=3.12"
description = "Week 9 lab: the Week 8 risk scoring agent deployed to a simulated AWS environment and to a simulated on-prem Ollama environment."
dependencies = [
    "httpx>=0.28",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskservice", "src/simaws"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/riskservice", "src/simaws"]

[tool.coverage.report]
fail_under = 100
show_missing = true
